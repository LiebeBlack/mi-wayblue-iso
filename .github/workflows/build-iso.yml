name: Compilar ISO Wayblue

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Detectar versión base de Fedora
        id: get_version
        run: |
          # Extrae dinámicamente la versión de Fedora desde la imagen de Wayblue
          echo "Descargando la imagen de Wayfire para leer su configuración..."
          podman pull ghcr.io/wayblueorg/wayfire:latest
          VERSION=$(podman run --rm ghcr.io/wayblueorg/wayfire:latest cat /usr/lib/os-release | grep '^VERSION_ID=' | cut -d= -f2 | tr -d '"')
          echo "La imagen actual de Wayblue está basada en Fedora $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Generar la ISO Nativa
        uses: jasonn3/build-container-installer@main
        with:
          arch: x86_64
          image_repo: ghcr.io/wayblueorg
          image_name: wayfire
          image_tag: latest
          version: ${{ steps.get_version.outputs.VERSION }}
          iso_name: wayblue-wayfire.iso

      - name: Guardar la ISO para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Wayblue-Wayfire-ISO
          path: wayblue-wayfire.iso
          compression-level: 0
          retention-days: 1