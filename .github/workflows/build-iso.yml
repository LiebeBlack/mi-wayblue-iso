name: Build Custom Debian 14 Labwc ISO (Secure Boot)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - "verify-debian-iso.sh"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Debian 14 (forky) + Labwc ISO
    runs-on: ubuntu-latest
    container:
      image: debian:forky
      options: --privileged
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pre-flight (repos, llaves GPG y espacio en disco)
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # Espacio: un build de live-build necesita ~10-12 GB libres
          free_gb="$(df --output=avail -BG /__w | tail -n 1 | tr -dc '0-9')"
          echo "Espacio disponible: ${free_gb} GB"
          if [ "${free_gb}" -lt 12 ]; then
            echo "ERROR: menos de 12 GB libres; el build fallaria a mitad." >&2
            exit 1
          fi

          # La imagen debian:forky es minimal y NO trae curl: primero apt
          ok=0
          for i in 1 2 3; do
            if apt-get update; then ok=1; break; fi
            echo "aviso: apt-get update fallo (intento ${i}/3); reintento..." >&2
            sleep 5
          done
          [ "${ok}" -eq 1 ] || { echo "ERROR: apt-get update fallo 3 veces" >&2; exit 1; }

          # curl para el pre-flight + llaves GPG del archivo SIEMPRE frescas
          apt-get install -y --reinstall debian-archive-keyring debootstrap curl ca-certificates

          # Los suites deben existir HOY (si forky se renombra o no esta
          # publicado, morimos aqui en segundos con diagnostico, no a mitad)
          for url in \
            http://deb.debian.org/debian/dists/forky/Release \
            http://deb.debian.org/debian/dists/forky-updates/Release \
            http://security.debian.org/debian-security/dists/forky-security/Release; do
            curl -fsSI --retry 3 --retry-delay 2 --max-time 30 "${url}" >/dev/null \
              || { echo "ERROR: el suite no responde: ${url}" >&2; exit 1; }
            echo "OK suite: ${url}"
          done

      - name: Install Build Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # SIN --no-install-recommends: se instala todo lo Recomendado para
          # que no falte nada (misma filosofia anti-errores que el resto del build)
          apt-get install -y \
            live-build \
            squashfs-tools \
            xorriso \
            dosfstools \
            e2fsprogs \
            mtools \
            binutils \
            curl \
            ca-certificates \
            sbsigntool \
            pesign

      # -----------------------------------------------------------------
      # live-build 20250814 aún pide libfuse2 en sus scripts de la fase
      # binary; en forky ese paquete NO existe (transición time64: solo
      # quedan libfuse2t64 y el runtime libfuse3-4, que es el que usa todo
      # el sistema base). Parcheamos la referencia a libfuse3-4 y dejamos
      # en el log el archivo:línea exacto para diagnóstico.
      # -----------------------------------------------------------------
      - name: Patch live-build (libfuse2 no existe en forky)
        run: |
          set -euo pipefail
          matches="$(grep -rln 'libfuse2' /usr/lib/live/build/ /usr/share/live/build 2>/dev/null || true)"
          if [ -n "${matches}" ]; then
            echo "Referencias a libfuse2 encontradas en:"
            echo "${matches}"
            grep -rn 'libfuse2' ${matches} || true
            # \b evita tocar "libfuse2t64" (que sí existe en forky)
            # shellcheck disable=SC2086
            sed -i 's/\blibfuse2\b/libfuse3-4/g' ${matches}
            echo "==> Parcheado a libfuse3-4 (runtime fuse3 de forky)."
          else
            echo "Sin referencias a libfuse2: nada que parchear."
          fi

      - name: Show live-build Version
        run: |
          lb --version
          lb config --dump || true

      - name: Configure live-build (auto/config is the source of truth)
        run: |
          # Inmune a perdidas del bit de ejecucion en checkout de Windows
          chmod +x auto/config config/hooks/live/*.hook.chroot
          sh auto/config
          lb config --dump

      - name: Build ISO
        run: |
          lb build 2>&1 | tee build.log
          test -f live-image-amd64.hybrid.iso

      - name: Rename and Checksum ISO
        run: |
          mv live-image-amd64.hybrid.iso debian14-labwc-300e.hybrid.iso
          sha256sum debian14-labwc-300e.hybrid.iso > debian14-labwc-300e.hybrid.iso.sha256
          ls -lah debian14-labwc-300e.hybrid.iso*

      # -------------------------------------------------------------------
      # GATE POST-BUILD: integridad (squashfs, grub.cfg, arbol EFI) y firmas
      # Authenticode de shim (Microsoft UEFI CA 2011) y grubx64.efi (Debian
      # Secure Boot CA). No se re-firma nada: los binarios firmados provienen
      # de los paquetes shim-signed / grub-efi-amd64-signed.
      # -------------------------------------------------------------------
      - name: Verify Secure Boot signatures and ISO integrity
        run: |
          chmod +x verify-debian-iso.sh
          bash verify-debian-iso.sh ./debian14-labwc-300e.hybrid.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian14-labwc-300e-iso
          path: |
            debian14-labwc-300e.hybrid.iso
            debian14-labwc-300e.hybrid.iso.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debian14-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload to GitHub Releases (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            debian14-labwc-300e.hybrid.iso
            debian14-labwc-300e.hybrid.iso.sha256
          tag_name: debian-labwc-secureboot-v2.0
          name: "Debian 14 Labwc Non-Free SecureBoot ISO"
          body: |
            ISO híbrida Debian 14 "forky" (beta) ultraligera optimizada para Lenovo 300e (Celeron N4120).

            - Compositor Wayland **Labwc** SIN panel (escritorio desnudo + fuzzel + foot)
            - Firmware Intel non-free: UHD 600 (i915) y Wi-Fi (iwd)
            - Audio PipeWire, red NetworkManager, thermald (equipo fanless)
            - Login gráfico ligero: greetd + tuigreet (usuario live/live en el modo live)
            - Instalador live: replica este sistema ya optimizado al disco
            - Arranque UEFI **Secure Boot** nativo (shim-signed + grub-efi-amd64-signed),
              firmas verificadas en CI antes de publicar
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
