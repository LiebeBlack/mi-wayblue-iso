name: Compilar ISO Wayblue

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar BlueBuild CLI
        run: |
          # Obtiene la URL dinámica del último release ejecutable para x86_64
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/blue-build/cli/releases/latest | grep -o "https://[^\"]*x86_64-unknown-linux-gnu.tar.gz" | head -n 1)
          echo "Descargando ejecutable desde: $DOWNLOAD_URL"
          curl -L -o bluebuild.tar.gz "$DOWNLOAD_URL"
          tar -xzf bluebuild.tar.gz
          sudo mv bluebuild /usr/local/bin/
          bluebuild --version

      - name: Generar la ISO de Wayfire
        run: |
          sudo bluebuild generate-iso --iso-name wayblue-wayfire.iso image ghcr.io/wayblueorg/wayfire:latest

      - name: Guardar la ISO para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Wayblue-Wayfire-ISO
          path: wayblue-wayfire.iso
          compression-level: 0
          retention-days: 1