name: Compilar ISO Wayblue

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar BlueBuild CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo blue-build/cli --pattern "*x86_64-unknown-linux-gnu.tar.gz" --clobber
          tar -xzf *.tar.gz
          sudo mv bluebuild /usr/local/bin/
          bluebuild --version

      - name: Generar la ISO de Wayfire
        run: |
          sudo bluebuild generate-iso --iso-name wayblue-wayfire.iso image ghcr.io/wayblueorg/wayfire:latest

      - name: Guardar la ISO para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Wayblue-Wayfire-ISO
          path: wayblue-wayfire.iso
          compression-level: 0
          retention-days: 1