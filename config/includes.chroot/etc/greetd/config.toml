# greetd: login grafico ligero -> tuigreet -> labwc
# Rutas ABSOLUTAS obligatorias: greetd no pasa por shell y las rutas
# relativas son un fallo tipico de sesion que no arranca.
[terminal]
vt = 1

[default_session]
command = "/usr/bin/tuigreet --time --remember --remember-session --cmd /usr/bin/labwc"
user = "greeter"
